name: Node.js CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # ⚠️ Keep this name fixed. Required status checks are configured per-organization
    # by check name, so renaming the job here silently exempts this repository
    # from the merge gate.
    name: CI Test

    # private repository: self-hosted
    # public repository: github-hosted
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted", "light"]' || '["ubuntu-latest"]') }}

    timeout-minutes: 60

    steps:
      # ⚠️ Actions are named by their major tag, and actions.lock pins the commit each one runs.
      # Regenerate the lockfile with `gh actions-lock --no-narrow`: without the flag the tool
      # rewrites a major tag to a full one, and the lockfile stops following the major.
      - name: 🛎️ Checkout repository code
        uses: actions/checkout@v7
        with:
          # ⚠️ Checkout otherwise leaves the token in .git/config for the rest
          # of the job, and no step here reaches a remote: npm ci talks to the
          # registry. What would still reach the token is an install script, which
          # arrives from whatever the lockfile of the branch under test names.
          persist-credentials: false

      - name: 🏗️ Use Node.js
        uses: actions/setup-node@v7
        with:
          # ⚠️ The npm cache only pays off where ~/.npm is discarded between jobs.
          # On a persistent [self-hosted] runner it re-ships what is already on disk,
          # adding a measured 2.7 GB and ~2m30s to this step so that the next one,
          # npm ci, can finish in 5s instead of 7s.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          # A floating LTS alias keeps every repository current without a scheduled
          # sweep to bump a pinned major across all of them. Pin a concrete version
          # here only in a repository that genuinely needs one.
          node-version: lts/*

      - name: 🖨️ Print environment
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          echo
          echo "runner: $RUNNER_ENVIRONMENT"
          echo "node  : $(node -v)"
          echo "npm   : $(npm -v)"

      - name: 📦 Install packages
        run: npm ci

      # ⚠️ This gate runs after npm ci and before ESLint and Jest.
      # The script imports its own dependency from node_modules, so it cannot run before the install.
      # What still matters is that an advisory answers before the installed files are executed,
      # and ESLint and Jest are the steps that execute them.
      # strict-allow-scripts in .npmrc stops npm ci from running install scripts,
      # so the install itself runs none of that code.
      #
      # ⚠️ The script runs npm audit itself and fails on every advisory except the ones
      # the file it is given lists, a stopgap until a release fixes them.
      # An entry whose advisory is no longer reported fails too, so the list cannot outlive its reason.
      #
      # ⚠️ A 503 from the advisory service leaves npm with no report, and the script says
      # so rather than listing advisories. npm does not retry the bulk POST —
      # `--fetch-retries=4` still sends one request — so rerun the job.
      - name: 🛡️ npm audit
        run: npm run audit:npm

      - name: 🛡️ Audit action versions
        run: npm run audit:actions

      - name: 🧵 ESLint
        run: npm run lint

      - name: 🧪 Jest
        env:
          NODE_ENV: development
        run: npm test

      - name: 🏷️ Skill names
        run: npm run skill-names
